services:
  - type: web
    name: saravana-bluemetals
    runtime: node
    plan: free
    buildCommand: npm run build:all
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: USE_LOCAL_STORE
        value: "false"
      - key: ALLOW_LOCAL_FALLBACK_ON_BOOTSTRAP_ERROR
        value: "true"
      - key: SHEETS_ROW_CACHE_TTL_MS
        value: "8000"
