services:
  - type: web
    name: saravana-sales-api
    runtime: node
    plan: free
    rootDir: auth-dashboard-starter/backend
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: USE_LOCAL_STORE
        value: "false"
      - key: ALLOW_LOCAL_FALLBACK_ON_BOOTSTRAP_ERROR
        value: "true"

  - type: web
    name: saravana-sales-frontend
    runtime: static
    plan: free
    rootDir: auth-dashboard-starter/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
